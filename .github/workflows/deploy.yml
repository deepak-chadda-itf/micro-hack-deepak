# Build, test, provision (Bicep) and deploy Octocat Supply to Azure Container Apps.
#
# Auth is OIDC only (no client secret). One-time setup: microhack-sdlc/infra/README.md
#   secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   variables: AZURE_RESOURCE_GROUP, (optional) PAYMENT_PROVIDER, PAYMENT_PUBLISHABLE_KEY
#   optional secret: PAYMENT_API_KEY (only when PAYMENT_PROVIDER=stripe)
# The deploy job uses the GitHub Environment "dev", so the federated credential
# subject is: repo:<owner>/<repo>:environment:dev

name: Deploy to Azure

on:
  push:
    branches: [main]
    paths:
      - 'microhack-sdlc/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-azure
  cancel-in-progress: false

env:
  APP_DIR: microhack-sdlc
  ENVIRONMENT_NAME: dev
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microhack-sdlc/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: API unit tests
        run: dotnet test api-cs-tests/OctoSupply.Api.Tests.csproj -c Release

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: microhack-sdlc/src/frontend/package-lock.json

      - name: Frontend install
        working-directory: microhack-sdlc/src/frontend
        run: npm ci

      - name: Frontend lint
        working-directory: microhack-sdlc/src/frontend
        run: npm run lint

      - name: Frontend build
        working-directory: microhack-sdlc/src/frontend
        run: npm run build

      - name: Validate Bicep
        working-directory: microhack-sdlc
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

  deploy:
    name: Provision & deploy
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ steps.infra.outputs.frontend_url }}
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      PAYMENT_PROVIDER: ${{ vars.PAYMENT_PROVIDER || 'demo' }}
      PAYMENT_PUBLISHABLE_KEY: ${{ vars.PAYMENT_PUBLISHABLE_KEY }}
      PAYMENT_API_KEY: ${{ secrets.PAYMENT_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision infrastructure (phase 1 - registry, identity, environment)
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "infra-bootstrap" \
            --template-file "$APP_DIR/infra/main.bicep" \
            --parameters "$APP_DIR/infra/main.parameters.json" \
            --parameters environmentName="$ENVIRONMENT_NAME" deployApps=false \
            --only-show-errors
          ACR_NAME=$(az deployment group show -g "$RESOURCE_GROUP" -n infra-bootstrap --query properties.outputs.acrName.value -o tsv)
          echo "ACR_NAME=$ACR_NAME" >> "$GITHUB_ENV"

      - name: Build & push images
        run: |
          az acr login --name "$ACR_NAME"
          LOGIN_SERVER="$ACR_NAME.azurecr.io"
          docker build -t "$LOGIN_SERVER/api:$IMAGE_TAG" -f "$APP_DIR/src/api-cs/Dockerfile" "$APP_DIR/src"
          docker build -t "$LOGIN_SERVER/frontend:$IMAGE_TAG" -f "$APP_DIR/src/frontend/Dockerfile" "$APP_DIR/src/frontend"
          docker push "$LOGIN_SERVER/api:$IMAGE_TAG"
          docker push "$LOGIN_SERVER/frontend:$IMAGE_TAG"

      - name: Deploy apps (phase 2)
        id: infra
        run: |
          LOGIN_SERVER="$ACR_NAME.azurecr.io"
          # A freshly created AcrPull role assignment can take a minute to propagate.
          for attempt in 1 2 3; do
            if az deployment group create \
                --resource-group "$RESOURCE_GROUP" \
                --name "infra-apps" \
                --template-file "$APP_DIR/infra/main.bicep" \
                --parameters "$APP_DIR/infra/main.parameters.json" \
                --parameters environmentName="$ENVIRONMENT_NAME" deployApps=true \
                    apiImage="$LOGIN_SERVER/api:$IMAGE_TAG" \
                    frontendImage="$LOGIN_SERVER/frontend:$IMAGE_TAG" \
                    paymentProvider="$PAYMENT_PROVIDER" \
                    paymentPublishableKey="$PAYMENT_PUBLISHABLE_KEY" \
                    paymentApiKey="$PAYMENT_API_KEY" \
                --only-show-errors; then
              break
            fi
            if [ "$attempt" = 3 ]; then echo "Deployment failed after 3 attempts" >&2; exit 1; fi
            echo "Deployment attempt $attempt failed; retrying in 60s"; sleep 60
          done
          FRONTEND_URL=$(az deployment group show -g "$RESOURCE_GROUP" -n infra-apps --query properties.outputs.frontendUrl.value -o tsv)
          API_URL=$(az deployment group show -g "$RESOURCE_GROUP" -n infra-apps --query properties.outputs.apiUrl.value -o tsv)
          echo "frontend_url=$FRONTEND_URL" >> "$GITHUB_OUTPUT"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test (cart -> checkout)
        run: bash "$APP_DIR/scripts/smoke-test.sh" "${{ steps.infra.outputs.frontend_url }}" "${{ steps.infra.outputs.api_url }}"

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo "- Frontend: ${{ steps.infra.outputs.frontend_url }}"
            echo "- API: ${{ steps.infra.outputs.api_url }}"
            echo "- Image tag: \`$IMAGE_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
